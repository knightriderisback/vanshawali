<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070910"><meta name="description" content="Vansh Vruksh 3D — interactive digital family universe.">
<title>Vansh Vruksh 3D — Digital Family Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css"></head>
<body><div id="app"><div id="scene"></div>
<header class="topbar glass"><div class="brand"><div class="mark">✦</div><div><h1 id="title">Vansh Vruksh 3D</h1><p>Digital Family Universe</p></div></div>
<div class="search"><span>⌕</span><input id="search" placeholder="Find a family member…"><div id="results"></div></div>
<div class="actions"><button data-action="reset">Reset</button><button data-action="add">＋ Person</button><button data-action="data">Data</button></div></header>
<div class="stats glass"><b id="peopleCount">0</b> people <i></i> <b id="bondCount">0</b> bonds</div>
<nav class="rail glass"><button data-action="add">＋</button><button data-action="relationship">⌁</button><button data-action="filters">☷</button><button data-action="legend">◈</button><button data-action="data">⇅</button><button data-action="reset">↺</button><button data-action="fullscreen">⛶</button></nav>
<aside id="panel" class="panel glass hidden"></aside>
<div id="loading" class="loading"><div class="spinner"></div><strong>Building your family universe…</strong><span id="loadText">Loading 3D characters</span></div><div id="toast"></div></div>
<script type="module" src="./app.js"></script></body></html>
